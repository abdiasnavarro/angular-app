<h1>Dragon ball Page</h1>

<section class="row">
  <div class="col-12 col-sm-6">
    
  </div>

  <div class="col-12 col-sm-6">
    <h3>Listado</h3>
    <ol>
      @for (character of characters(); track character.id) 
      { @if (character.power > 500) {
        <li>
            <span>{{ character.name }}</span>
            <strong [class.text-danger]="character.power > 9000"> ({{ character.power }}) </strong>
        </li>
      } @else { <strong>Salsa</strong> } }
    </ol>
  </div>
</section>
