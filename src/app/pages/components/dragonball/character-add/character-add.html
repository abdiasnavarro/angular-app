<h3>Agregar: {{ name() }}</h3>
    <input type="text" class="form-control" placeholder="Nombre" [value]="name()" (change)="name.set($event.target.value)"/>
    <input type="number" class="form-control mt-2" placeholder="Poder" [value]="power()" (change)="power.set(+powerTxt.value)" #powerTxt/>

    <button class="mt-2 btn btn-primary" (click)="addCharacter()">Agregar</button>
